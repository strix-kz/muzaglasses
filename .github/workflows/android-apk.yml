name: Build Muza Glasses APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::Firebase config is missing. Building an INSTALLATION TEST APK only; Google login, Firebase AI and Firestore will not work until real configuration is provided."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "muza-build-placeholder",
              "storage_bucket": "muza-build-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef123456",
                "android_client_info": {"package_name": "com.rake.muza"}
              },
              "api_key": [{"current_key": "placeholder-not-a-real-api-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
          fi
      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK and capture compiler diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log
      - name: Show actionable build errors
        if: failure()
        shell: bash
        run: |
          echo '## Muza Glasses APK build errors' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full build.log is attached as a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          grep -E -i -m 40 '(^e: |error:|^FAILURE:|^\* What went wrong:|Unresolved reference|Compilation error|Could not resolve|Execution failed)' build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MuzaGlasses-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuzaGlasses-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
